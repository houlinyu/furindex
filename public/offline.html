<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — FurIndex</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#fbfaf8;color:#1c1a17;
       font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:1.5rem}
  @media (prefers-color-scheme: dark){body{background:#15181a;color:#edeae6}}
  .card{max-width:22rem}
  h1{font-size:1.35rem;margin:0 0 .5rem}
  p{color:#6f6a63;line-height:1.55;margin:0}
  @media (prefers-color-scheme: dark){p{color:#9aa0a4}}
  .mark{width:56px;height:56px;margin:0 auto 1rem;display:block}
</style>
</head>
<body>
  <div class="card">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#24806a"/></svg>
    <h1>You're offline</h1>
    <p>FurIndex needs a connection to show your pet's records. Reconnect and it'll pick up right where you left off.</p>
  </div>
</body>
</html>
